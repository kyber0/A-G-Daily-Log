<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Close App</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Light mode (default) ─────────────────────────────────────────── */
    :root {
      --clr-bg:          #f8fafc;
      --clr-surface:     #ffffff;
      --clr-surface-2:   #f1f5f9;
      --clr-border:      #e2e8f0;
      --clr-primary:     #0d9488;
      --clr-text:        #0f172a;
      --clr-text-muted:  #475569;
      --clr-error:       #ef4444;
      --clr-error-bg:    rgba(239, 68, 68, 0.08);
      --clr-error-border:rgba(239, 68, 68, 0.22);
      --shadow:          0 8px 32px rgba(0, 0, 0, 0.10), 0 1px 4px rgba(0, 0, 0, 0.06);
    }

    /* ── Dark mode ────────────────────────────────────────────────────── */
    [data-theme="dark"] {
      --clr-bg:          #0f1115;
      --clr-surface:     #171a21;
      --clr-surface-2:   #1f242e;
      --clr-border:      #2a303d;
      --clr-primary:     #14b8a6;
      --clr-text:        #f1f5f9;
      --clr-text-muted:  #94a3b8;
      --clr-error:       #f87171;
      --clr-error-bg:    rgba(248, 113, 113, 0.10);
      --clr-error-border:rgba(248, 113, 113, 0.25);
      --shadow:          0 16px 48px rgba(0, 0, 0, 0.60), 0 1px 4px rgba(0, 0, 0, 0.4);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Card ─────────────────────────────────────────────────────────── */
    .card {
      width: 100%;
      height: 100%;
      background: var(--clr-surface);
      border: 1px solid var(--clr-border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Body ─────────────────────────────────────────────────────────── */
    .body {
      flex: 1;
      padding: 32px 28px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    /* Icon ring — flat, no glow */
    .icon-ring {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: var(--clr-error-bg);
      border: 1px solid var(--clr-error-border);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 18px;
      flex-shrink: 0;
    }

    .icon-ring svg {
      width: 24px; height: 24px;
      color: var(--clr-error);
      stroke: var(--clr-error);
    }

    h2 {
      font-size: 17px;
      font-weight: 800;
      color: var(--clr-text);
      margin-bottom: 10px;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    p {
      font-size: 13px;
      color: var(--clr-text-muted);
      line-height: 1.65;
    }

    /* ── Footer ───────────────────────────────────────────────────────── */
    .footer {
      padding: 16px 24px 20px;
      display: flex;
      gap: 10px;
      border-top: 1px solid var(--clr-border);
    }

    button {
      flex: 1;
      height: 42px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
      outline: none;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Cancel / Stay — subtle ghost */
    #btn-cancel {
      background: var(--clr-surface-2);
      border-color: var(--clr-border);
      color: var(--clr-text-muted);
    }
    #btn-cancel:hover {
      color: var(--clr-text);
      border-color: var(--clr-text-muted);
    }
    #btn-cancel:active {
      transform: scale(0.97);
    }

    /* Confirm / Close App — flat red, no gradient */
    #btn-confirm {
      background: var(--clr-error);
      border-color: transparent;
      color: #fff;
    }
    #btn-confirm:hover {
      filter: brightness(1.08);
    }
    #btn-confirm:active {
      transform: scale(0.97);
      filter: brightness(0.95);
    }

    [data-theme="dark"] #btn-confirm {
      /* Slightly muted red on dark so it isn't too harsh */
      background: #dc2626;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="body">
      <div class="icon-ring">
        <!-- Log-out arrow icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </div>
      <h2>Close Application?</h2>
      <p>Are you sure you want to exit?<br>Any unsynced data will be saved before closing.</p>
    </div>
    <div class="footer">
      <button id="btn-cancel">Stay</button>
      <button id="btn-confirm">Close App</button>
    </div>
  </div>

  <script>
    // ── Apply theme from URL query param passed by main/index.ts ────────
    ;(function () {
      const params = new URLSearchParams(window.location.search)
      const theme = params.get('theme') || 'light'
      document.documentElement.setAttribute('data-theme', theme)
    })()

    document.getElementById('btn-confirm').addEventListener('click', () => {
      window.electronConfirmClose.confirm()
    })
    document.getElementById('btn-cancel').addEventListener('click', () => {
      window.electronConfirmClose.cancel()
    })
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') window.electronConfirmClose.cancel()
      if (e.key === 'Enter')  window.electronConfirmClose.confirm()
    })
  </script>
</body>
</html>
